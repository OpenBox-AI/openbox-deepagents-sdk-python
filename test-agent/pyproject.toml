[project]
name = "openbox-deepagent-test-agent"
version = "1.0.0"
description = "Test DeepAgents agent using the OpenBox DeepAgent Python SDK"
requires-python = ">=3.11"
dependencies = [
    "openbox-deepagent-sdk-python>=0.2.0",
    "deepagents>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=1.3.3",
    "httpx>=0.27.0",
    "langsmith>=0.8.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.7.0",
]

[tool.uv.sources]
openbox-deepagent-sdk-python = { path = "../", editable = true }
deepagents = { path = "../../deepagents/libs/deepagents", editable = true }
